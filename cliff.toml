# git-cliff ~ configuration file
# Generated from the default configuration with `git cliff --init` and adapted for this project.
# https://git-cliff.org/docs/configuration

[changelog]
# A Tera template to be rendered as the changelog's header.
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# A Tera template to be rendered for each release in the changelog.
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}
"""
footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}...{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/releases/tag/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [Unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true
render_always = true

[git]
conventional_commits = true
# Keep non-conventional commits visible in the catch-all Changed group.
filter_unconventional = false
require_conventional = false
protect_breaking_commits = true
commit_parsers = [
    { message = "^Merge ", skip = true },
    { message = "^chore\\(ci\\): add git-cliff changelog$", skip = true },
    { message = "^docs\\(changelog\\): backfill release history$", skip = true },
    { message = "^(remove|delete)(\\([^)]+\\))?:", group = "Removed" },
    { message = "^.*: (remove|delete)\\b", group = "Removed" },
    { message = "^feat(\\([^)]+\\))?!?:", group = "Added" },
    { message = "^add(\\([^)]+\\))?:", group = "Added" },
    { message = "^fix(\\([^)]+\\))?!?:", group = "Fixed" },
    { message = "^test(\\([^)]+\\))?:", group = "Fixed" },
    { message = ".*", group = "Changed" },
]
filter_commits = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"

[remote.github]
owner = "jfrz38"
repo = "opencode-copy-last"
