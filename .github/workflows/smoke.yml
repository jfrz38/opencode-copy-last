name: OpenCode compatibility smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/smoke.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/smoke-opencode-compatibility.mjs"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: OpenCode 1.18.29 and 2.0.29
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package compatibility smoke test
        run: pnpm test:smoke
