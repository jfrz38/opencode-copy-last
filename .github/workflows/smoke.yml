name: OpenCode compatibility smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/smoke.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/smoke-opencode-compatibility.mjs"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: OpenCode 1.18.29 and 2.0.29
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package compatibility smoke test
        run: pnpm test:smoke
